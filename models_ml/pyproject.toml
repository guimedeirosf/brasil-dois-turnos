[project]
name = "models-ml"
version = "0.1.0"
description = "Inferencia ecologica R x C das transicoes de voto entre turnos"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "polars>=1.20",
]

[project.optional-dependencies]
ei = ["pyei>=1.1", "arviz>=0.17"]
dev = ["mypy>=1.10", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: roda a amostragem MCMC de verdade (precisa do extra ei)"]
addopts = "-m 'not lento'"

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "NPY"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["polars.*", "duckdb.*", "pyei.*", "arviz.*"]
ignore_missing_imports = true
