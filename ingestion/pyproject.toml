[project]
name = "ingestion"
version = "0.1.0"
description = "Ingestao das fontes publicas para a camada Bronze do brasil-dois-turnos"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2",
    "httpx>=0.27",
    "polars>=1.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
r2 = ["boto3>=1.34"]
dev = [
    "boto3-stubs[s3]>=1.34",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: fonte ponta a ponta com fixtures reais"]

[tool.coverage.report]
fail_under = 80
omit = ["src/ingestion/sources/rais.py", "src/ingestion/sources/caged.py", "src/ingestion/sources/cnpj.py", "src/ingestion/sources/tesouro.py", "src/ingestion/sources/transferencias.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["polars.*", "duckdb.*", "respx.*"]
ignore_missing_imports = true
