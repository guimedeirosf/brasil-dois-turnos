name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          enable-cache: true
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e "ingestion[dev,r2]" -e "models_ml[dev]"
      - run: make lint
      - run: make test

  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          enable-cache: true
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: transform/dbt_packages
          key: dbt-${{ hashFiles('transform/packages.yml') }}
      - run: uv venv --python 3.12 .venv
      - run: >-
          uv pip install --python .venv/bin/python -e ingestion dbt-duckdb sqlfluff
          sqlfluff-templater-dbt
      - run: cd transform && ../.venv/bin/dbt deps --profiles-dir .
      # dbt build com fixtures, exportacao da Gold de teste e validacao dos exemplos do chat
      - run: make exemplos
        env:
          DBT_TARGET: ci
          BRONZE_DIR: ../data/ci/bronze
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: gold-ci
          path: data/ci/gold
          retention-days: 3

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json
      - run: npm ci
      - run: npm run build:semantic
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  web:
    runs-on: ubuntu-latest
    needs: dados
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: gold-ci
          path: data/ci/gold
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /
      - run: npx playwright install --with-deps chromium
      - run: npm test
