name: ingest-eleicao

on:
  workflow_dispatch:
    inputs:
      ano:
        description: Ano da eleicao
        required: true
        default: "2026"
      cargo:
        description: Cargo
        required: true
        default: presidente
        type: choice
        options: [presidente]

permissions:
  contents: read

concurrency:
  group: ingest-eleicao-${{ inputs.ano }}-${{ inputs.cargo }}
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANO: ${{ inputs.ano }}
      CARGO: ${{ inputs.cargo }}
      DBT_TARGET: prod
      AMBIENTE: prod
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          enable-cache: true
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: transform/dbt_packages
          key: dbt-${{ hashFiles('transform/packages.yml') }}
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e "ingestion[r2]" dbt-duckdb
      - run: cd transform && ../.venv/bin/dbt deps --profiles-dir .
      # O CSV de presidente tem 1,5 GB: lido em streaming e gravado UF por UF
      - run: make ingest-eleicao
      # Falha em qualquer teste interrompe antes de publicar
      - run: make dbt-eleicao
      - run: make exportar
      - run: make publicar
