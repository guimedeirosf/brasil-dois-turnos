name: inferencia

on:
  workflow_dispatch:
    inputs:
      ano:
        required: true
        default: "2026"
      cargo:
        required: true
        default: presidente
      aceitar_revisao:
        description: Publicar mesmo com fidelidade abaixo de 0,85 (apos revisao manual)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: inferencia-${{ inputs.ano }}-${{ inputs.cargo }}
  cancel-in-progress: false

jobs:
  uf:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # limite do Actions e 6 h; UF grande e dividida em grupos de municipios
    strategy:
      fail-fast: false
      matrix:
        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO, ZZ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          enable-cache: true
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e "models_ml[ei]"
      - name: Inferencia ecologica da UF
        run: >-
          .venv/bin/python -m models_ml inferir --ano ${{ inputs.ano }} --cargo ${{ inputs.cargo }}
          --uf ${{ matrix.uf }} --entrada ${{ vars.GOLD_PUBLIC_URL }} --saida parciais
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: parcial-${{ matrix.uf }}
          path: parciais
          retention-days: 7

  agregar:
    runs-on: ubuntu-latest
    needs: uf
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e "ingestion[r2]" -e models_ml
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: parcial-*
          merge-multiple: true
          path: parciais
      # Codigo 2 = reprovado, 3 = revisao manual: em ambos o job falha e nada e publicado
      - name: Agregar e validar
        run: >-
          .venv/bin/python -m models_ml agregar --ano ${{ inputs.ano }} --cargo ${{ inputs.cargo }}
          --parciais parciais --gold data/gold
          ${{ inputs.aceitar_revisao && '--aceitar-revisao' || '' }}
      - run: .venv/bin/python -c "from pathlib import Path; from ingestion.gold import gerar_manifesto; gerar_manifesto(Path('data/gold'))"
      - run: .venv/bin/python -m ingestion publicar-gold --run-id ${{ github.run_id }}
