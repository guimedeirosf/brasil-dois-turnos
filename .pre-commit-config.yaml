default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: sqlfluff
        name: sqlfluff (dbt)
        # .venv/bin no Linux e no macOS, .venv/Scripts no Windows
        entry: bash -c 'B=$PWD/.venv/bin; [ -d .venv/Scripts ] && B=$PWD/.venv/Scripts; cd transform && $B/sqlfluff lint models tests'
        language: system
        files: ^transform/.*\.sql$
        pass_filenames: false

      - id: mypy
        name: mypy (estrito)
        entry: bash -c 'B=$PWD/.venv/bin; [ -d .venv/Scripts ] && B=$PWD/.venv/Scripts; cd ingestion && $B/mypy src && cd ../models_ml && $B/mypy src'
        language: system
        files: ^(ingestion|models_ml)/src/.*\.py$
        pass_filenames: false

      - id: sem-arquivos-de-ferramentas
        name: bloqueia arquivos de ferramentas de IA e segredos
        entry: arquivos de ferramentas locais nao devem ser versionados
        language: fail
        files: (^|/)(CLAUDE\.md|AGENTS\.md|\.claude/|\.cursor/|\.env)

      - id: sem-co-autoria
        name: bloqueia Co-Authored-By na mensagem de commit
        entry: '(?i)co-authored-by'
        language: pygrep
        stages: [commit-msg]
