version: 2

sources:
  - name: diretorios
    description: Municipios do IBGE (API de localidades) e de-para de codigos TSE <-> IBGE.
    meta:
      external_location: >-
        read_parquet('{{ env_var("BRONZE_DIR", "../data/bronze") }}/diretorios/{name}/part-0.parquet')
    tables:
      - name: municipios_ibge
      - name: municipios_tse

  - name: bcb_sgs
    description: Series mensais do Banco Central (SGS).
    meta:
      external_location: >-
        read_parquet('{{ env_var("BRONZE_DIR", "../data/bronze") }}/bcb_sgs/*/*.parquet',
        hive_partitioning = true, union_by_name = true)
    freshness:
      warn_after: {count: 45, period: day}
      error_after: {count: 60, period: day}
    loaded_at_field: "cast(_carregado_em as timestamp)"
    tables:
      - name: series

  - name: ibge_sidra
    description: Tabelas do IBGE SIDRA, uma particao por periodo.
    meta:
      external_location: >-
        read_parquet('{{ env_var("BRONZE_DIR", "../data/bronze") }}/ibge_sidra/{name}/*/*.parquet',
        hive_partitioning = true, union_by_name = true)
    tables:
      - name: populacao_estimada
